# Publicação automática do site (https://innerplacement.com.br/).
# Roda a cada commit na main — inclusive os feitos pelo painel /admin (posts e depoimentos) — e pode ser
# disparada à mão em Actions → "Publicar site" → Run workflow. Usa tools/publicar-producao.sh, que recusa
# rodar enquanto houver WordPress na raiz.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   SSH_CHAVE_PUBLICACAO  chave privada dedicada a esta publicação (sem senha; só existe aqui e no cPanel)
#   SSH_KNOWN_HOSTS       linha(s) de `ssh-keyscan -p 22 innerplacement.com.br` conferidas pelo dono
# Sem esses segredos o job para logo no início, sem publicar nada.
# A conexão exige uma chave do servidor já registrada em SSH_KNOWN_HOSTS; não aceita chaves novas.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uma publicação por vez; um commit novo espera a anterior terminar.
concurrency:
  group: publicar-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Acesso SSH ao servidor
        env:
          CHAVE: ${{ secrets.SSH_CHAVE_PUBLICACAO }}
          HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$HOSTS" ]; then
            echo "::error::Faltam os segredos SSH_CHAVE_PUBLICACAO e/ou SSH_KNOWN_HOSTS."; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/publicacao && chmod 600 ~/.ssh/publicacao
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CFG'
          Host inner-v2
              HostName innerplacement.com.br
              User s100c354
              Port 22
              IdentityFile ~/.ssh/publicacao
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              UserKnownHostsFile ~/.ssh/known_hosts
          CFG
          command -v rsync >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rsync; }

      - name: Testar acesso ao servidor
        # Só diagnóstico: mostra onde a conexão para (rede, chave do servidor ou autenticação).
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -v inner-v2 true 2>&1 \
            | grep -E 'Connecting|Connection|Authenticat|Offering|Server accepts|denied|refused|reset|timed out|Host key|Exit status' || true

      - name: Publicar
        run: tools/publicar-producao.sh

      - name: Apagar a chave
        if: always()
        run: rm -f ~/.ssh/publicacao
